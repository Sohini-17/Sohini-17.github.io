<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sohini — Portfolio</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
}

body {
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

/* =========================================
   HERO
========================================= */

.hero {
  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background: #111;
}

/* =========================================
   VIDEO
========================================= */

#characterVideo {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  pointer-events: none;

  background: #111;
}

/*
   The video itself is visually rendered
   full-screen.

   No rotateX.
   No rotateY.
   No perspective.
*/

/* =========================================
   DARK SUBTLE OVERLAY
========================================= */

.hero::after {
  content: "";

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.18),
      transparent 55%
    );

  pointer-events: none;

  z-index: 1;
}

/* =========================================
   NAV
========================================= */

.nav {
  position: absolute;

  top: 28px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;

  gap: 4px;

  padding: 7px;

  border:
    1px solid
    rgba(255,255,255,.2);

  border-radius: 999px;

  background:
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.25);

  z-index: 10;
}

.nav a {
  padding:
    10px 18px;

  border-radius: 999px;

  color:
    rgba(255,255,255,.75);

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .15em;

  text-decoration: none;

  transition:
    .25s ease;
}

.nav a:hover {
  color: white;

  background:
    rgba(255,255,255,.12);
}

/* =========================================
   CONTENT
========================================= */

.content {
  position: absolute;

  left:
    clamp(24px, 5vw, 72px);

  bottom:
    clamp(30px, 7vh, 82px);

  width:
    min(
      380px,
      calc(100vw - 48px)
    );

  color: white;

  z-index: 5;

  text-shadow:
    0 5px 30px
    rgba(0,0,0,.35);
}

.hello {
  margin-bottom: 2px;

  font-size: 17px;

  color:
    rgba(255,255,255,.85);
}

.name {
  font-family:
    "Brush Script MT",
    "Segoe Script",
    cursive;

  font-size:
    clamp(
      70px,
      9vw,
      120px
    );

  font-weight: 500;

  line-height: .9;

  letter-spacing: -.04em;
}

.bio {
  max-width: 340px;

  margin:
    20px 0 25px;

  color:
    rgba(255,255,255,.7);

  font-size: 13px;

  line-height: 1.7;
}

/* =========================================
   BUTTONS
========================================= */

.buttons {
  display: flex;

  gap: 10px;
}

.button {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  min-height: 46px;

  padding:
    0 21px;

  border-radius: 999px;

  font-size: 12px;

  font-weight: 700;

  text-decoration: none;

  transition:
    transform .2s ease,
    background .2s ease;
}

.button:hover {
  transform:
    translateY(-2px);
}

.resume {
  color: #111;

  background: white;

  border:
    1px solid white;
}

.talk {
  color: white;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.35);

  backdrop-filter:
    blur(16px);

  -webkit-backdrop-filter:
    blur(16px);
}

.talk:hover {
  background:
    rgba(255,255,255,.16);
}

/* =========================================
   CURSOR
========================================= */

.cursor-dot {
  position: fixed;

  top: 0;
  left: 0;

  width: 7px;
  height: 7px;

  margin:
    -3.5px;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 0 15px
    rgba(255,255,255,.9),

    0 0 35px
    rgba(255,255,255,.45);

  pointer-events: none;

  z-index: 9999;
}

.cursor-ring {
  position: fixed;

  top: 0;
  left: 0;

  width: 38px;
  height: 38px;

  margin:
    -19px;

  border:
    1px solid
    rgba(255,255,255,.55);

  border-radius: 50%;

  background:
    rgba(255,255,255,.03);

  pointer-events: none;

  z-index: 9998;

  transition:
    width .25s ease,
    height .25s ease,
    margin .25s ease,
    background .25s ease;
}

.cursor-ring.hover {
  width: 58px;
  height: 58px;

  margin:
    -29px;

  background:
    rgba(255,255,255,.08);
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

  .nav {
    top: 18px;
  }

  .nav a {
    padding:
      9px 11px;

    font-size: 9px;
  }

  .content {
    bottom: 30px;
  }

  .name {
    font-size: 70px;
  }

  .bio {
    font-size: 12px;

    margin:
      16px 0 20px;
  }

}

@media (pointer: coarse) {

  .cursor-dot,
  .cursor-ring {
    display: none;
  }

}

</style>
</head>

<body>

<div class="hero">

  <!-- YOUR VIDEO -->
  <video
    id="characterVideo"
    src="intro.mp4"
    muted
    playsinline
    preload="auto"
  ></video>


  <!-- NAVIGATION -->

  <nav class="nav">

    <a href="#work">
      WORK
    </a>

    <a href="#about">
      ABOUT
    </a>

    <a href="#contact">
      CONTACT
    </a>

  </nav>


  <!-- TEXT -->

  <section class="content">

    <p class="hello">
      Hi, I’m
    </p>

    <h1 class="name">
      Sohini
    </h1>

    <p class="bio">
      Full Stack Developer crafting
      immersive digital experiences,
      thoughtful interfaces, and
      beautifully engineered products.
    </p>

    <div class="buttons">

      <a
        class="button resume"
        href="#"
      >
        Resume
        <span>↗</span>
      </a>

      <a
        class="button talk"
        href="#contact"
      >
        Let’s Talk
      </a>

    </div>

  </section>


  <!-- CURSOR -->

  <div
    id="cursorDot"
    class="cursor-dot"
  ></div>

  <div
    id="cursorRing"
    class="cursor-ring"
  ></div>

</div>


<script>

/* =========================================
   VIDEO
========================================= */

const video =
  document.getElementById(
    "characterVideo"
  );


/* =========================================
   CURSOR
========================================= */

const dot =
  document.getElementById(
    "cursorDot"
  );

const ring =
  document.getElementById(
    "cursorRing"
  );


let mouseX =
  window.innerWidth / 2;

let mouseY =
  window.innerHeight / 2;

let ringX =
  mouseX;

let ringY =
  mouseY;


/* =========================================
   CURSOR MOVEMENT
========================================= */

window.addEventListener(
  "pointermove",
  function(event) {

    mouseX =
      event.clientX;

    mouseY =
      event.clientY;


    dot.style.transform =
      `translate(
        ${mouseX}px,
        ${mouseY}px
      )`;

  },
  {
    passive: true
  }
);


/* =========================================
   SMOOTH CURSOR RING
========================================= */

function animateCursor() {

  ringX +=
    (
      mouseX -
      ringX
    ) * 0.18;

  ringY +=
    (
      mouseY -
      ringY
    ) * 0.18;


  ring.style.transform =
    `translate(
      ${ringX}px,
      ${ringY}px
    )`;


  requestAnimationFrame(
    animateCursor
  );
}

animateCursor();


/* =========================================
   INTERACTIVE CURSOR
========================================= */

document
  .querySelectorAll(
    "a, button"
  )
  .forEach(
    function(element) {

      element.addEventListener(
        "pointerenter",
        function() {

          ring.classList.add(
            "hover"
          );

        }
      );

      element.addEventListener(
        "pointerleave",
        function() {

          ring.classList.remove(
            "hover"
          );

        }
      );

    }
  );


/* =========================================
   CHARACTER TRACKING
========================================= */

let targetTime = 0;

let smoothTime = 0;


/*
   Change this if the video contains
   extra footage at the beginning/end.

   0 = first frame
   1 = last frame
*/

function updateCharacter() {

  if (
    !video.duration ||
    !isFinite(video.duration)
  ) {

    requestAnimationFrame(
      updateCharacter
    );

    return;
  }


  const faceX =
    window.innerWidth * 0.50;

  const faceY =
    window.innerHeight * 0.43;


  const dx =
    mouseX - faceX;

  const dy =
    mouseY - faceY;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  /*
     12% center deadzone.
     Character looks directly
     at the camera here.
  */

  const deadzone =
    Math.sqrt(
      window.innerWidth *
      window.innerWidth +

      window.innerHeight *
      window.innerHeight
    ) * 0.12;


  if (
    distance < deadzone
  ) {

    /*
       Last frame is assumed
       to be the neutral pose.
    */

    targetTime =
      video.duration;

  } else {

    let angle =
      Math.atan2(
        dy,
        dx
      );


    /*
       Convert angle to
       0 → 1 around the circle.
    */

    angle =
      angle +
      Math.PI / 2;


    if (angle < 0) {
      angle +=
        Math.PI * 2;
    }


    const normalized =
      (
        angle %
        (Math.PI * 2)
      ) /
      (Math.PI * 2);


    targetTime =
      normalized *
      video.duration;
  }


  /*
     Smooth movement.
  */

  smoothTime +=
    (
      targetTime -
      smoothTime
    ) * 0.26;


  /*
     Seek to the desired
     position.
  */

  if (
    Math.abs(
      video.currentTime -
      smoothTime
    ) > 0.008
  ) {

    video.currentTime =
      smoothTime;

  }


  requestAnimationFrame(
    updateCharacter
  );
}


/* =========================================
   START
========================================= */

video.addEventListener(
  "loadedmetadata",
  function() {

    /*
       Do NOT autoplay.

       We use the video's frames
       according to cursor position.
    */

    video.pause();

    video.currentTime = 0;

    requestAnimationFrame(
      updateCharacter
    );

  }
);

</script>

</body>
</html>
